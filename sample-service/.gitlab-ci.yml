# Everything a team writes on GitLab. The gates live in the platform component.
include:
  - component: $CI_SERVER_FQDN/platform/ci-templates/golden-pipeline@1.0.0
    inputs:
      build_image: registry.corp.example/platform/build-python:3.12
      min_overall_coverage: 80     # new service -> full 80% from day one (legacy repos: start at today's number)

# Team-owned deploy jobs go below. Protected environments + "deploy only from main"
# are enforced in GitLab settings, not here.
deploy-dev:
  stage: release
  needs: [qg:build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: dev
  script:
    - echo "deploy dist/ to dev"
